# Properties module: create, list, view, update and delete real estate listings.
# Every endpoint in this module requires a JWT access token.
tags:
  - name: Properties
    description: Real estate listings. All endpoints require authentication.

components:
  parameters:
    PropertyId:
      name: id
      in: path
      required: true
      description: Property ID (24-character MongoDB ObjectId)
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
        example: 6710c3f2a1b2c3d4e5f60719
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Search:
      name: search
      in: query
      description: Case-insensitive search in title, description, street and city
      schema:
        type: string
        example: ocean view
    City:
      name: city
      in: query
      description: Exact city match (case-insensitive)
      schema:
        type: string
        example: Lagos
    State:
      name: state
      in: query
      schema:
        type: string
    Country:
      name: country
      in: query
      schema:
        type: string
    PropertyTypeFilter:
      name: propertyType
      in: query
      schema:
        $ref: '#/components/schemas/PropertyType'
    ListingTypeFilter:
      name: listingType
      in: query
      schema:
        $ref: '#/components/schemas/ListingType'
    StatusFilter:
      name: status
      in: query
      schema:
        $ref: '#/components/schemas/PropertyStatus'
    MinPrice:
      name: minPrice
      in: query
      schema:
        type: number
        minimum: 0
    MaxPrice:
      name: maxPrice
      in: query
      schema:
        type: number
        minimum: 0
    MinBedrooms:
      name: minBedrooms
      in: query
      schema:
        type: integer
        minimum: 0
    MinBathrooms:
      name: minBathrooms
      in: query
      schema:
        type: integer
        minimum: 0
    IsFeatured:
      name: isFeatured
      in: query
      schema:
        type: boolean
    SortBy:
      name: sortBy
      in: query
      schema:
        type: string
        enum: [createdAt, price, bedrooms, areaSqft]
        default: createdAt
    SortOrder:
      name: sortOrder
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  schemas:
    PropertyType:
      type: string
      enum: [APARTMENT, HOUSE, CONDO, TOWNHOUSE, LAND, COMMERCIAL, OFFICE]
    ListingType:
      type: string
      enum: [SALE, RENT]
    PropertyStatus:
      type: string
      enum: [AVAILABLE, PENDING, SOLD, RENTED]

    Address:
      type: object
      required: [street, city, state, country]
      properties:
        street:
          type: string
          example: 12 Admiralty Way
        city:
          type: string
          example: Lagos
        state:
          type: string
          example: Lagos State
        country:
          type: string
          example: Nigeria
        zipCode:
          type: string
          example: '106104'

    PropertyOwner:
      type: object
      properties:
        id:
          type: string
          example: 6710c3f2a1b2c3d4e5f60718
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          example: jane.doe@example.com
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [USER, AGENT, ADMIN]

    Property:
      type: object
      properties:
        id:
          type: string
          example: 6710c3f2a1b2c3d4e5f60719
        title:
          type: string
          example: Modern 3-bedroom apartment in Lekki
        description:
          type: string
          example: Spacious, fully furnished apartment with ocean views, 24/7 power and security.
        price:
          type: number
          example: 250000
        currency:
          type: string
          example: USD
        propertyType:
          $ref: '#/components/schemas/PropertyType'
        listingType:
          $ref: '#/components/schemas/ListingType'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        bedrooms:
          type: integer
          example: 3
        bathrooms:
          type: integer
          example: 2
        areaSqft:
          type: number
          nullable: true
          example: 1450
        yearBuilt:
          type: integer
          nullable: true
          example: 2019
        address:
          $ref: '#/components/schemas/Address'
        latitude:
          type: number
          nullable: true
          example: 6.4474
        longitude:
          type: number
          nullable: true
          example: 3.4721
        amenities:
          type: array
          items:
            type: string
          example: [Swimming pool, Gym, Parking]
        images:
          type: array
          items:
            type: string
            format: uri
          example: [https://example.com/images/apartment-1.jpg]
        isFeatured:
          type: boolean
          example: false
        ownerId:
          type: string
          example: 6710c3f2a1b2c3d4e5f60718
        owner:
          $ref: '#/components/schemas/PropertyOwner'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePropertyRequest:
      type: object
      required: [title, description, price, propertyType, listingType, address]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 150
          example: Modern 3-bedroom apartment in Lekki
        description:
          type: string
          minLength: 20
          example: Spacious, fully furnished apartment with ocean views, 24/7 power and security.
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 250000
        currency:
          type: string
          description: 3-letter ISO currency code
          default: USD
          example: USD
        propertyType:
          $ref: '#/components/schemas/PropertyType'
        listingType:
          $ref: '#/components/schemas/ListingType'
        status:
          allOf:
            - $ref: '#/components/schemas/PropertyStatus'
          default: AVAILABLE
        bedrooms:
          type: integer
          minimum: 0
          default: 0
          example: 3
        bathrooms:
          type: integer
          minimum: 0
          default: 0
          example: 2
        areaSqft:
          type: number
          example: 1450
        yearBuilt:
          type: integer
          example: 2019
        address:
          $ref: '#/components/schemas/Address'
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 6.4474
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 3.4721
        amenities:
          type: array
          items:
            type: string
          example: [Swimming pool, Gym, Parking]
        images:
          type: array
          items:
            type: string
            format: uri
          example: [https://example.com/images/apartment-1.jpg]
        isFeatured:
          type: boolean
          description: Only applied when the request is made by an ADMIN; ignored otherwise.
          default: false

    UpdatePropertyRequest:
      type: object
      description: >
        Send only the fields you want to change. `address` fields are merged into the existing address.
        Set `areaSqft`, `yearBuilt`, `latitude` or `longitude` to `null` to clear them.
        `isFeatured` can only be changed by an ADMIN.
      minProperties: 1
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
          example: 240000
        currency:
          type: string
        propertyType:
          $ref: '#/components/schemas/PropertyType'
        listingType:
          $ref: '#/components/schemas/ListingType'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        bedrooms:
          type: integer
        bathrooms:
          type: integer
        areaSqft:
          type: number
          nullable: true
        yearBuilt:
          type: integer
          nullable: true
        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
            country:
              type: string
            zipCode:
              type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        amenities:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
            format: uri
        isFeatured:
          type: boolean

    PropertyResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Property retrieved successfully
        data:
          $ref: '#/components/schemas/Property'

    PropertyListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Properties retrieved successfully
        data:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

paths:
  /properties:
    get:
      tags: [Properties]
      summary: Get all properties
      description: Paginated list of all listings with filtering, search and sorting.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/PropertyTypeFilter'
        - $ref: '#/components/parameters/ListingTypeFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/MinBedrooms'
        - $ref: '#/components/parameters/MinBathrooms'
        - $ref: '#/components/parameters/IsFeatured'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: List of properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Properties]
      summary: List a new property
      description: Creates a listing owned by the authenticated user and emails them a confirmation.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyRequest'
      responses:
        '201':
          description: Property created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /properties/me:
    get:
      tags: [Properties]
      summary: Get my properties
      description: Paginated list of listings owned by the authenticated user. Accepts the same filters as `GET /properties`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/PropertyTypeFilter'
        - $ref: '#/components/parameters/ListingTypeFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: The user's properties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /properties/{id}:
    parameters:
      - $ref: '#/components/parameters/PropertyId'
    get:
      tags: [Properties]
      summary: Get property details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Property details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Properties]
      summary: Update a property
      description: Only the owner of the listing or an ADMIN can update it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyRequest'
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Properties]
      summary: Delete a property
      description: Only the owner of the listing or an ADMIN can delete it. The owner is notified by email.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Property deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
